name: 发布 Windows 绿色版

on:
  push:
    branches:
      - release/v0.3.10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布 Windows 单体版
    runs-on: windows-latest
    env:
      PYTHON_VERSION: "3.12.10"
      RELEASE_TAG: "v0.3.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 构建中文前端
        working-directory: apps/web
        run: |
          npm ci
          npm run test
          npm run build

      - name: 准备 Windows Python 运行时和后端依赖
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "portable-runtime"
          $runtime = Join-Path $stage "runtime"
          New-Item -ItemType Directory -Force -Path $runtime, (Join-Path $runtime "Lib\site-packages"), (Join-Path $runtime "apps\api"), (Join-Path $runtime "web_dist"), (Join-Path $runtime "seed\data"), (Join-Path $runtime "seed\wiki") | Out-Null

          $archive = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime -Force
          @("python312.zip", ".", "Lib", "Lib\site-packages", "import site") | Set-Content -LiteralPath (Join-Path $runtime "python312._pth") -Encoding ascii

          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile (Join-Path $env:RUNNER_TEMP "get-pip.py")
          & (Join-Path $runtime "python.exe") (Join-Path $env:RUNNER_TEMP "get-pip.py") --disable-pip-version-check
          & (Join-Path $runtime "python.exe") -m pip install --disable-pip-version-check --no-cache-dir --target (Join-Path $runtime "Lib\site-packages") "fastapi>=0.115,<1" "uvicorn[standard]>=0.32,<1" "pydantic>=2.10,<3" "lancedb>=0.20,<1" "numpy>=2,<3" "httpx>=0.28,<1" "psutil>=7,<8" "truststore>=0.10,<1"

          Copy-Item -Recurse -Force apps/api/app (Join-Path $runtime "apps\api\app")
          Copy-Item -Force apps/api/standalone_entry.py $runtime
          Copy-Item -Recurse -Force apps/web/dist/* (Join-Path $runtime "web_dist")
          & (Join-Path $runtime "python.exe") -c "import sys; sys.path.insert(0, r'$runtime\apps\api'); from pathlib import Path; from app.repositories.workspace import WorkspaceRepository; WorkspaceRepository(Path(r'$runtime\seed\data\app.db'))"

      - name: 验证模型驱动研究及后端 API
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $env:GITHUB_WORKSPACE "portable-runtime\runtime"
          $sitePackages = Join-Path $runtime "Lib\site-packages"
          & (Join-Path $runtime "python.exe") -m pip install --disable-pip-version-check --no-cache-dir --target $sitePackages "pytest>=8,<10"
          if ($LASTEXITCODE -ne 0) { throw "测试依赖安装失败" }
          Push-Location apps/api
          try {
            & (Join-Path $runtime "python.exe") -m pytest -q tests
            if ($LASTEXITCODE -ne 0) { throw "后端测试失败，不允许发布" }
          } finally { Pop-Location }

      - name: 校验旧项目 SQLite 白板恢复
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE "apps\api"
          python apps/api/tests/test_legacy_canvas_sqlite.py
          if ($LASTEXITCODE -ne 0) { throw "旧项目白板恢复测试失败" }

      - name: 编译原生启动器
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "未找到 Visual C++ 构建工具" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          $command = "`"$vcvars`" && cl /nologo /O2 /DUNICODE /D_UNICODE packaging\windows\launcher.c /Fe:portable-launcher.exe /link /SUBSYSTEM:WINDOWS user32.lib"
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "原生启动器编译失败：$LASTEXITCODE" }

      - name: 生成单体 EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = Join-Path $env:RUNNER_TEMP "Content_Intelligence_Canvas_v0.3.10_payload.zip"
          & python -c "import shutil; shutil.make_archive(r'$($payload -replace '\.zip$','')', 'zip', root_dir=r'portable-runtime\runtime')"
          & python scripts/build_windows_portable.py portable-launcher.exe $payload Content_Intelligence_Canvas_Portable_v0.3.10.exe
          Get-FileHash Content_Intelligence_Canvas_Portable_v0.3.10.exe -Algorithm SHA256 | Format-List

      - name: 验证 EXE 启动、接口和旧进程替换
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:GITHUB_WORKSPACE "Content_Intelligence_Canvas_Portable_v0.3.10.exe"
          $pidFile = Join-Path $env:LOCALAPPDATA "ContentIntelligenceCanvas\runtime-process.json"
          function Wait-For-App([int]$previousPid) {
            for ($attempt = 0; $attempt -lt 180; $attempt++) {
              Start-Sleep -Seconds 1
              if (-not (Test-Path $pidFile)) { continue }
              try {
                $appPid = [int](Get-Content -LiteralPath $pidFile -Raw | ConvertFrom-Json).pid
                if ($appPid -eq $previousPid) { continue }
                $connections = Get-NetTCPConnection -State Listen -OwningProcess $appPid -ErrorAction SilentlyContinue |
                  Where-Object { $_.LocalAddress -eq '127.0.0.1' }
                foreach ($connection in $connections) {
                  $health = Invoke-RestMethod -Uri "http://127.0.0.1:$($connection.LocalPort)/api/health" -TimeoutSec 2 -ErrorAction Stop
                  if ($health.status -eq 'ok') { return $appPid }
                }
              } catch { }
            }
            throw "单体 EXE 未能在 180 秒内提供本地健康接口。"
          }
          try {
            Start-Process -FilePath $exe | Out-Null
            $firstPid = Wait-For-App 0
            $connection = Get-NetTCPConnection -State Listen -OwningProcess $firstPid | Where-Object { $_.LocalAddress -eq '127.0.0.1' } | Select-Object -First 1
            $baseUrl = "http://127.0.0.1:$($connection.LocalPort)"
            $project = Invoke-RestMethod -Method Post -Uri "$baseUrl/api/projects" -ContentType 'application/json; charset=utf-8' -Body '{"name":"发布验证","idea":"验证白板启动和新节点","brief":""}'
            $canvas = Invoke-RestMethod -Uri "$baseUrl/api/projects/$($project.id)/canvas"
            if (-not $canvas.nodes -or $canvas.nodes.Count -lt 2) { throw "新项目白板读取失败" }
            $nodeId = ($canvas.nodes | Where-Object { $_.type -eq 'idea' } | Select-Object -First 1).id
            $body = @{ node_ids=@($nodeId); instruction='整理为新节点'; output_type='insight' } | ConvertTo-Json
            $failed = Invoke-WebRequest -SkipHttpErrorCheck -Method Post -Uri "$baseUrl/api/projects/$($project.id)/magic" -ContentType 'application/json; charset=utf-8' -Body $body
            if ($failed.StatusCode -ne 422) { throw "未配置模型时应明确失败，实际状态 $($failed.StatusCode)" }
            $after = Invoke-RestMethod -Uri "$baseUrl/api/projects/$($project.id)/canvas"
            if ($after.nodes.Count -ne $canvas.nodes.Count) { throw "模型失败后不应生成模板节点" }
            Start-Process -FilePath $exe | Out-Null
            $secondPid = Wait-For-App $firstPid
            if (Get-Process -Id $firstPid -ErrorAction SilentlyContinue) { throw "旧实例仍在运行。" }
            Write-Host "EXE 启动成功，健康接口可用，旧进程 $firstPid 已由新进程 $secondPid 替换。"
          } finally {
            if (Test-Path $pidFile) {
              $appPid = [int](Get-Content -LiteralPath $pidFile -Raw | ConvertFrom-Json).pid
              Stop-Process -Id $appPid -Force -ErrorAction SilentlyContinue
            }
          }

      - name: 将发布标签指向本次构建提交
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git tag -f $env:RELEASE_TAG $env:GITHUB_SHA
          git push --force origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "发布标签更新失败：$LASTEXITCODE" }

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Content Intelligence Canvas v0.3.10
          body: |
            Windows portable public test build.

            大模型现在先理解问题并规划 Wiki 检索，再阅读原文、回答并验证引用。快速研究生成带证据的白板节点；模型不可用时明确失败，不再用本地模板冒充 AI 结果。

            白板 AI 共创和内容生成默认调用模型，结合所选节点与 Wiki 内容。新版中文 PRD 在 docs/PRD-v0.3.10.md；Windows 构建验证后端测试、EXE 白板接口、模型报错和旧实例替换。

            这是公开测试版，不包含用户私有 Wiki、数据库或 API Key。首次启动后，请在“设置”中添加本地 Wiki 路径并配置模型。
          files: Content_Intelligence_Canvas_Portable_v0.3.10.exe
          generate_release_notes: true
