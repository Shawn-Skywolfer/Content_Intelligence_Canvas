name: 发布 Windows 绿色版

on:
  push:
    branches:
      - release/v0.3.32
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-release:
    name: 构建并发布 Windows 单体版
    runs-on: windows-latest
    env:
      PYTHON_VERSION: "3.12.10"
      RELEASE_TAG: "v0.3.32"
    steps:
      - name: 取消该发布分支的过时构建
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh api "repos/${{ github.repository }}/actions/workflows/release-windows.yml/runs?branch=${{ github.ref_name }}&per_page=10" | ConvertFrom-Json
          foreach ($run in $runs.workflow_runs) {
            if ($run.id -ne [long]"${{ github.run_id }}" -and $run.status -ne "completed") {
              gh api --method POST "repos/${{ github.repository }}/actions/runs/$($run.id)/cancel"
            }
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 构建中英双语前端
        working-directory: apps/web
        run: |
          python ../../scripts/prepare_public_ci_lock.py
          npm ci
          npm run test
          npm run build

      - name: Chromium 验证中英切换与英文页面
        run: |
          cd apps/web
          npx playwright install chromium
          cd ../..
          node scripts/check_bilingual.cjs
          if ($LASTEXITCODE -ne 0) { throw "双语验收失败" }
          node scripts/check_edge_tabs.cjs
          if ($LASTEXITCODE -ne 0) { throw "双语浏览器验收失败" }

      - name: 保存双语界面验收截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-ui-screenshots
          path: bilingual-screenshots
          if-no-files-found: ignore

      - name: 准备 Windows Python 运行时和后端依赖
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "portable-runtime"
          $runtime = Join-Path $stage "runtime"
          New-Item -ItemType Directory -Force -Path $runtime, (Join-Path $runtime "Lib\site-packages"), (Join-Path $runtime "apps\api"), (Join-Path $runtime "web_dist"), (Join-Path $runtime "seed\data"), (Join-Path $runtime "seed\wiki") | Out-Null

          $archive = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime -Force
          @("python312.zip", ".", "Lib", "Lib\site-packages", "import site") | Set-Content -LiteralPath (Join-Path $runtime "python312._pth") -Encoding ascii

          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile (Join-Path $env:RUNNER_TEMP "get-pip.py")
          & (Join-Path $runtime "python.exe") (Join-Path $env:RUNNER_TEMP "get-pip.py") --disable-pip-version-check
          & (Join-Path $runtime "python.exe") -m pip install --disable-pip-version-check --no-cache-dir --target (Join-Path $runtime "Lib\site-packages") "fastapi>=0.115,<1" "uvicorn[standard]>=0.32,<1" "pydantic>=2.10,<3" "pydantic-settings>=2.7,<3" "lancedb>=0.20,<1" "numpy>=2,<3" "httpx>=0.28,<1" "psutil>=7,<8" "truststore>=0.10,<1"

          Copy-Item -Recurse -Force apps/api/app (Join-Path $runtime "apps\api\app")
          Copy-Item -Force apps/api/standalone_entry.py $runtime
          Copy-Item -Recurse -Force apps/web/dist/* (Join-Path $runtime "web_dist")
          & (Join-Path $runtime "python.exe") -c "import sys; sys.path.insert(0, r'$runtime\apps\api'); from pathlib import Path; from app.repositories.workspace import WorkspaceRepository; WorkspaceRepository(Path(r'$runtime\seed\data\app.db'))"

      - name: 验证模型驱动研究及后端 API
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $env:GITHUB_WORKSPACE "portable-runtime\runtime"
          $sitePackages = Join-Path $runtime "Lib\site-packages"
          & (Join-Path $runtime "python.exe") -m pip install --disable-pip-version-check --no-cache-dir --target $sitePackages "pytest>=8,<10"
          if ($LASTEXITCODE -ne 0) { throw "测试依赖安装失败" }
          Push-Location apps/api
          try {
            & (Join-Path $runtime "python.exe") -m pytest -q tests
            if ($LASTEXITCODE -ne 0) { throw "后端测试失败，不允许发布" }
          } finally { Pop-Location }

      - name: 校验旧项目 SQLite 白板恢复
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE "apps\api"
          python apps/api/tests/test_legacy_canvas_sqlite.py
          if ($LASTEXITCODE -ne 0) { throw "旧项目白板恢复测试失败" }

      - name: 编译原生启动器
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "未找到 Visual C++ 构建工具" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          $command = "`"$vcvars`" && cl /nologo /O2 /MT /utf-8 /DUNICODE /D_UNICODE packaging\windows\launcher.c /Fe:portable-launcher.exe /link /SUBSYSTEM:WINDOWS /MANIFEST:EMBED /MANIFESTINPUT:packaging\windows\app.manifest user32.lib shell32.lib"
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "原生启动器编译失败：$LASTEXITCODE" }

      - name: 生成单体 EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = Join-Path $env:RUNNER_TEMP "Content_Intelligence_Canvas_v0.3.32_payload.zip"
          & python -c "import shutil; shutil.make_archive(r'$($payload -replace '\.zip$','')', 'zip', root_dir=r'portable-runtime\runtime')"
          & python scripts/build_windows_portable.py portable-launcher.exe $payload Content_Intelligence_Canvas_Portable_v0.3.32.exe
          Get-FileHash Content_Intelligence_Canvas_Portable_v0.3.32.exe -Algorithm SHA256 | Format-List

      - name: 验证 EXE 启动、接口和旧进程替换
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testFolder = Join-Path $env:RUNNER_TEMP "工作台 O'Brien 启动测试"
          New-Item -ItemType Directory -Force -Path $testFolder | Out-Null
          $exe = Join-Path $testFolder "内容智能工作台.exe"
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "Content_Intelligence_Canvas_Portable_v0.3.32.exe") $exe
          $env:LOCALAPPDATA = Join-Path $testFolder "用户 O'Brien 本地缓存"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $env:CIC_NO_BROWSER = "1"
          $env:HTTP_PROXY = "http://127.0.0.1:9"
          $env:HTTPS_PROXY = "http://127.0.0.1:9"
          $pidFile = Join-Path $env:LOCALAPPDATA "ContentIntelligenceCanvas\runtime-process.json"
          $oldRuntime = Join-Path $env:LOCALAPPDATA "ContentIntelligenceCanvas\runtime-v0.3.8"
          New-Item -ItemType Directory -Force -Path $oldRuntime | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $oldRuntime ".ready") | Out-Null
          function Show-Startup-Diagnostics {
            $control = Join-Path $env:LOCALAPPDATA "ContentIntelligenceCanvas"
            foreach ($file in @("launcher.log", "startup-python.log", "startup-status.json")) {
              $diagnostic = Join-Path $control $file
              if (Test-Path -LiteralPath $diagnostic) { Write-Host "启动诊断 $file"; Get-Content -LiteralPath $diagnostic -Encoding utf8 -Tail 100 }
            }
          }
          function Read-App-Identity { return Get-Content -LiteralPath $pidFile -Raw | ConvertFrom-Json }
          function Assert-Instance-Exited($identity) {
            $previous = Get-CimInstance Win32_Process -Filter "ProcessId=$($identity.pid)" -ErrorAction SilentlyContinue
            if (-not $previous) { return }
            $created = ([DateTimeOffset]::new($previous.CreationDate.ToUniversalTime())).ToUnixTimeMilliseconds() / 1000.0
            if ($previous.ExecutablePath -eq $identity.executable -and [Math]::Abs($created - [double]$identity.create_time) -lt 1) {
              throw "旧应用实例仍在运行：PID=$($identity.pid)，创建时间=$created"
            }
            Write-Host "旧实例已退出；PID $($identity.pid) 已由其他进程使用。"
          }
          function Wait-For-App($previousIdentity) {
            for ($attempt = 0; $attempt -lt 180; $attempt++) {
              Start-Sleep -Seconds 1
              if (-not (Test-Path $pidFile)) { continue }
              try {
                $identity = Read-App-Identity
                $appPid = [int]$identity.pid
                if ($previousIdentity -and $appPid -eq [int]$previousIdentity.pid -and [Math]::Abs([double]$identity.create_time - [double]$previousIdentity.create_time) -lt .001) { continue }
                $connections = Get-NetTCPConnection -State Listen -OwningProcess $appPid -ErrorAction SilentlyContinue |
                  Where-Object { $_.LocalAddress -eq '127.0.0.1' }
                foreach ($connection in $connections) {
                  $health = Invoke-RestMethod -NoProxy -Uri "http://127.0.0.1:$($connection.LocalPort)/api/health" -TimeoutSec 2 -ErrorAction Stop
                  if ($health.status -eq 'ok') { Write-Host "实例已就绪 PID=$appPid，创建时间=$($identity.create_time)"; return $appPid }
                }
              } catch { }
            }
            Show-Startup-Diagnostics
            throw "单体 EXE 未能在检查时限内提供本地健康接口。"
          }
          try {
            Start-Process -FilePath $exe | Out-Null
            Write-Host "开始验证：冷启动"
            $firstPid = Wait-For-App $null
            $firstIdentity = Read-App-Identity
            $newRuntime = Join-Path $env:LOCALAPPDATA "ContentIntelligenceCanvas\runtime-v0.3.32"
            if (-not (Test-Path (Join-Path $newRuntime "standalone_entry.py"))) {
              throw "新版 EXE 错误复用了旧版运行时缓存。"
            }
            $connection = Get-NetTCPConnection -State Listen -OwningProcess $firstPid | Where-Object { $_.LocalAddress -eq '127.0.0.1' } | Select-Object -First 1
            $baseUrl = "http://127.0.0.1:$($connection.LocalPort)"
            $project = Invoke-RestMethod -NoProxy -Method Post -Uri "$baseUrl/api/projects" -ContentType 'application/json; charset=utf-8' -Body '{"name":"发布验证","idea":"验证白板启动和新节点","brief":""}'
            $canvas = Invoke-RestMethod -NoProxy -Uri "$baseUrl/api/projects/$($project.id)/canvas"
            if (-not $canvas.nodes -or $canvas.nodes.Count -lt 2) { throw "新项目白板读取失败" }
            $nodeId = ($canvas.nodes | Where-Object { $_.type -eq 'idea' } | Select-Object -First 1).id
            $summary = Invoke-WebRequest -NoProxy -SkipHttpErrorCheck -Method Post -Uri "$baseUrl/api/projects/$($project.id)/nodes/$nodeId/summary" -ContentType 'application/json; charset=utf-8' -Body '{"force":false}'
            if ($summary.StatusCode -ne 422) { throw "未配置模型时摘要应明确失败，实际状态 $($summary.StatusCode)" }
            $body = @{ node_ids=@($nodeId); instruction='整理为新节点'; output_type='insight' } | ConvertTo-Json
            $failed = Invoke-WebRequest -NoProxy -SkipHttpErrorCheck -Method Post -Uri "$baseUrl/api/projects/$($project.id)/magic" -ContentType 'application/json; charset=utf-8' -Body $body
            if ($failed.StatusCode -ne 422) { throw "未配置模型时应明确失败，实际状态 $($failed.StatusCode)" }
            $asyncJob = Invoke-RestMethod -NoProxy -Method Post -Uri "$baseUrl/api/projects/$($project.id)/magic/start" -ContentType 'application/json; charset=utf-8' -Body $body
            $persisted = Invoke-RestMethod -NoProxy -Uri "$baseUrl/api/projects/$($project.id)/magic/jobs"
            if (-not ($persisted | Where-Object { $_.job_id -eq $asyncJob.job_id })) { throw "白板独立任务未持久化" }
            $mcpConfig = Invoke-RestMethod -NoProxy -Uri "$baseUrl/api/settings/mcp-search"
            if ($mcpConfig.enabled -or -not $mcpConfig.url) { throw "MCP 默认配置读取失败" }
            $after = Invoke-RestMethod -NoProxy -Uri "$baseUrl/api/projects/$($project.id)/canvas"
            if ($after.nodes.Count -ne $canvas.nodes.Count) { throw "模型失败后不应生成模板节点" }
            Start-Process -FilePath $exe | Out-Null
            Write-Host "开始验证：热启动和旧进程替换"
            $secondPid = Wait-For-App $firstIdentity
            $secondIdentity = Read-App-Identity
            Assert-Instance-Exited $firstIdentity
            $readyNode = Invoke-RestMethod -NoProxy -Uri "http://127.0.0.1:$((Get-NetTCPConnection -State Listen -OwningProcess $secondPid | Where-Object { $_.LocalAddress -eq '127.0.0.1' } | Select-Object -First 1).LocalPort)/api/projects/$($project.id)/canvas"
            if (-not $readyNode.nodes) { throw "重新启动后项目内容丢失" }
            Remove-Item -LiteralPath (Join-Path $newRuntime "Lib\site-packages\fastapi\__init__.py") -Force
            $env:CIC_EXTRACTOR = "dotnet"
            Start-Process -FilePath $exe | Out-Null
            Write-Host "开始验证：损坏缓存修复"
            $thirdPid = Wait-For-App $secondIdentity
            $thirdIdentity = Read-App-Identity
            Remove-Item Env:\CIC_EXTRACTOR
            if (-not (Test-Path (Join-Path $newRuntime "Lib\site-packages\fastapi\__init__.py"))) { throw "缺损缓存未自动修复" }
            Assert-Instance-Exited $secondIdentity
            $clickA = Start-Process -FilePath $exe -PassThru
            $clickB = Start-Process -FilePath $exe -PassThru
            $clickA.WaitForExit(120000) | Out-Null
            $clickB.WaitForExit(120000) | Out-Null
            if (-not $clickA.HasExited -or -not $clickB.HasExited -or $clickA.ExitCode -ne 0 -or $clickB.ExitCode -ne 0) { throw "连续双击启动未完成" }
            Write-Host "开始验证：连续双击后进程检查"
            $finalPid = Wait-For-App $thirdIdentity
            Assert-Instance-Exited $thirdIdentity
            $runtimeRoot = Split-Path $newRuntime -Parent
            $owned = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*standalone_entry.py*' -and $_.ExecutablePath -like "$runtimeRoot\runtime-*" })
            if ($owned.Count -ne 1) { throw "连续启动后应用进程数异常：$($owned.Count)" }
            $status = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA "ContentIntelligenceCanvas\startup-status.json") -Raw | ConvertFrom-Json
            if ($status.phase -ne '服务已就绪') { throw "启动诊断未记录服务就绪" }
            Write-Host "已验证：中文及单引号路径、无效环境代理、冷启动/热启动/缓存修复/连续双击、旧进程替换与项目保留。"
          } finally {
            Show-Startup-Diagnostics
            if (Test-Path $pidFile) {
              $appPid = [int](Get-Content -LiteralPath $pidFile -Raw | ConvertFrom-Json).pid
              Stop-Process -Id $appPid -Force -ErrorAction SilentlyContinue
            }
          }

      - name: 保存失败的启动诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portable-startup-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/工作台 O'Brien 启动测试/**/*.log
            ${{ runner.temp }}/工作台 O'Brien 启动测试/**/startup-status.json
          if-no-files-found: warn

      - name: 将发布标签指向本次构建提交
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git tag $env:RELEASE_TAG $env:GITHUB_SHA
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "发布标签更新失败：$LASTEXITCODE" }

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Content Intelligence Canvas v0.3.32
          body: |
            Windows portable v0.3.32 / 中英双语绿色版。

            修复 Wiki 检索规划长时间停滞：首轮总览与领域图仍完整阅读；可选关系规划只发送关系资料和已完成计划，60 秒超时后沿用首轮计划继续。规划调用使用独立输出预算和总时限，不改变最终写作配置。

            非流式接收在关闭 TLS 连接前交付已收到的正文；网络读取、JSON 解析受统一时限监督，日志写入不会阻塞正文交付。LOG 新增应用版本、调用 ID、阶段、输入字符数、预算和线程诊断。白板任务连续 180 秒无活动会停止并保留草稿，避免无限等待。中文路径解包改用 ASCII 相对参数与 .NET 后备方式；旧实例退出使用进程身份核验并确认终止完成。

            清理项目、研究、白板、内容资产和设置页面的冗余说明，统一对齐；必要帮助改为支持键盘的提示，高级模型配置默认收起。保留中英双语、实际进度、错误详情、危险操作后果提示和 v0.3.31 白板连线修复。

            Bounded Wiki planning, recoverable relation refinement, and complete-response delivery before TLS cleanup. Logging cannot hold up a received answer. Cleaner bilingual pages, accessible help, aligned forms, and keyboard navigation for settings tabs.

            Portable Windows EXE. Existing data stays in the current data directory. No private Wiki, logs or API keys are included in this public release. Back up your data before upgrading.
          files: Content_Intelligence_Canvas_Portable_v0.3.32.exe
          generate_release_notes: true
