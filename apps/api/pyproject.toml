[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-intelligence-canvas-api"
version = "0.3.3"
description = "Local-first knowledge, canvas and content workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "lancedb>=0.20,<1",
  "numpy>=2,<3",
  "httpx>=0.28,<1",
  "psutil>=7,<8",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: tests that index the supplied real Wiki"]
